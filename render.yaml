# Render blueprint — the full Node server, including the stateful
# /api/interview/* session flow that serverless hosts can't hold.
#
# Deploy: render.com → New → Blueprint → point at this repo.
# Then add ANTHROPIC_API_KEY under the service's Environment tab.
services:
  - type: web
    name: preppilot
    runtime: node
    plan: free
    region: singapore          # nearest to most users of this app; change freely
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false            # set this in the Render dashboard, never in git
